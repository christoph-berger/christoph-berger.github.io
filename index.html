<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christoph Berger</title>
  <meta name="description" content="Projects by Christoph Berger">
  <style>
    :root{
      font-family: Inter, Arial, sans-serif;
      color:#17324d;
      background:#f6f9fc;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:32px;
    }
    main{
      width:min(760px,100%);
      background:#ffffff;
      border:1px solid #dbe5ee;
      border-radius:24px;
      padding:42px;
      box-shadow:0 18px 50px rgba(23,50,77,.08);
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(2rem,5vw,3.4rem);
      letter-spacing:-.03em;
    }
    .sub{
      margin:0 0 34px;
      color:#6b7f92;
      font-size:1.05rem;
    }
    h2{
      margin:0 0 16px;
      font-size:1rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#3d8fa3;
    }
    .project{
      display:block;
      text-decoration:none;
      color:inherit;
      border:1px solid #d8e6ee;
      border-radius:18px;
      padding:22px 24px;
      transition:.18s ease;
      background:linear-gradient(180deg,#fbfdff,#f7fbfd);
    }
    .project:hover{
      transform:translateY(-2px);
      border-color:#84bdca;
      box-shadow:0 10px 24px rgba(61,143,163,.12);
    }
    .project-title{
      font-size:1.35rem;
      font-weight:700;
      margin-bottom:6px;
    }
    .project-text{
      color:#6b7f92;
      line-height:1.55;
    }
    .arrow{
      display:inline-block;
      margin-left:8px;
      color:#3d8fa3;
    }
    footer{
      margin-top:28px;
      color:#94a3b3;
      font-size:.88rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Christoph Berger</h1>
    <p class="sub">Research projects and interactive scientific visualizations.</p>

    <h2>Projekte</h2>

    <a class="project" href="./microstates/">
      <div class="project-title">EEG Microstates <span class="arrow">→</span></div>
      <div class="project-text">
        Interactive visualization and companion material on EEG microstate analysis
        and topographic dynamics.
      </div>
    </a>

    <footer>christoph-berger.github.io</footer>
  </main>
</body>
</html>
